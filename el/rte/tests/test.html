<!DOCTYPE HTML>
<html lang=en>
<head>
    <meta charset=utf-8>
    <meta name=viewport content="width=device-width">
    <title>u2-rte test</title>
    <link rel=stylesheet href="../../../css/classless/full.css">
    <link rel=stylesheet href="../../../css/classless/simple.css">
    <link rel=stylesheet href="../rte.css">
    <script src="../rte.js" type=module async></script>

<body>

<section>
    <form id=form>
        <label>HTML
            <u2-rte style="--u2-rte-toolbar:bold italic underline bullets numbers">
                <textarea name=html required placeholder="Write rich text"><p>Some <strong>HTML</strong></p></textarea>
            </u2-rte>
        </label>

        <label>Markdown
            <u2-rte language=markdown style="--u2-rte-toolbar:bold italic bullets numbers">
                <textarea name=markdown># Markdown

Some **rich text**.</textarea>
            </u2-rte>
        </label>

        <button>Submit</button>
        <button type=reset>Reset</button>
    </form>
    <pre id=output></pre>
</section>

<script>
    form.addEventListener('input', show);
    form.addEventListener('change', show);
    form.addEventListener('submit', event => {
        event.preventDefault();
        show(event);
    });
    function show(event) {
        output.textContent = `${event?.type || 'initial'}\n${JSON.stringify(Object.fromEntries(new FormData(form)), null, 2)}`;
    }
    show();
</script>
