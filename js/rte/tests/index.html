<!doctype html>
<html lang=en>
<meta charset=utf-8>
<meta name=viewport content="width=device-width">
<title>RTE tests</title>
<style>
    body { font: 1rem/1.4 system-ui; }
    [data-result=passed] { color: green; }
    [data-result=failed] { color: red; white-space: pre-wrap; }
    [data-rte-fixture] { position: fixed; inset-inline-start: -100vw; }
</style>
<h1>RTE tests</h1>
<ol id=results></ol>
<script type=module>
    import '../src/browser/tests/range-rect.test.js';
    import '../src/client/tests/editor.test.js';
    import '../src/client/tests/external-input.test.js';
    import '../src/client/tests/blocks.test.js';
    import '../src/client/tests/breaks.test.js';
    import '../src/client/tests/classes.test.js';
    import '../src/client/tests/images.test.js';
    import '../src/client/tests/link.test.js';
    import '../src/client/tests/source.test.js';
    import '../src/client/tests/tables.test.js';
    import '../src/client/tests/unstyle.test.js';
    import '../src/command/tests/commands.test.js';
    import '../src/command/tests/block-boundary.test.js';
    import '../src/command/tests/block-style.test.js';
    import '../src/command/tests/delete.test.js';
    import '../src/command/tests/edit.test.js';
    import '../src/command/tests/element.test.js';
    import '../src/command/tests/enter.test.js';
    import '../src/command/tests/fragment.test.js';
    import '../src/command/tests/insert.test.js';
    import '../src/command/tests/list.test.js';
    import '../src/command/tests/mark.test.js';
    import '../src/command/tests/table.test.js';
    import '../src/command/tests/pending-marks.test.js';
    import '../src/command/tests/unstyle.test.js';
    import '../src/config/tests/config.test.js';
    import '../src/history/tests/history.test.js';
    import '../src/input/tests/external-input.test.js';
    import '../src/input/tests/input-pipeline.test.js';
    import '../src/mark/tests/standard.test.js';
    import '../src/mark/tests/dom-adapter.test.js';
    import '../src/mark/tests/mark.test.js';
    import '../src/model/tests/content-model.test.js';
    import '../src/model/html/tests/html-model.test.js';
    import '../src/normalize/repair/tests/repair-planner.test.js';
    import '../src/normalize/execute/tests/repair-executor.test.js';
    import '../src/normalize/normalizer/tests/normalizer.test.js';
    import '../playground/tests/playground.test.js';
    import '../src/source/tests/source.test.js';
    import '../src/selection/tests/snapshot.test.js';
    import '../src/selection/ownership/tests/ownership.test.js';
    import '../src/selection/point/tests/point.test.js';
    import '../src/selection/map/tests/point-map.test.js';
    import '../src/selection/range/tests/edit-range.test.js';
    import '../src/sanitize/tests/policy.test.js';
    import '../src/sanitize/tests/native.test.js';
    import '../src/transaction/tests/transaction.test.js';
    import '../src/unstyle/tests/unstyle.test.js';
    import '../src/surface/tests/surface.test.js';
    import '../src/core/tests/core.test.js';
    import '../src/ui/tests/chrome.test.js';
    import '../src/ui/tests/highlight.test.js';
    import '../src/ui/tests/place.test.js';
    import '../src/ui/tests/toolbar.test.js';
    import './blocks.test.js';
    import './breaks.test.js';
    import './generated.test.js';
    import './classes.test.js';
    import './images.test.js';
    import './link.test.js';
    import './source.test.js';
    import './tables.test.js';
    import './unstyle.test.js';
    import './rte.test.js';
    import {run} from './harness.js';

    const execute = async () => {
        const summary = await run(document.querySelector('#results'));
        document.querySelector('h1').append(` — ${summary.passed}/${summary.total}`);
    };
    const start = () => setTimeout(execute);
    document.readyState === 'complete'
        ? start()
        : addEventListener('load', start, {once: true});
</script>
