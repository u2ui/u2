name: Release

on:
  push:
    branches:
      - main
    paths:
      - package.json

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v4

      - name: Version lesen
        id: version
        run: echo "version=$(jq -r '.version' package.json)" >> $GITHUB_OUTPUT

      - name: Version schon veröffentlicht?
        id: check
        run: |
          if npm view u2ui@${{ steps.version.outputs.version }} version >/dev/null 2>&1; then
            echo "new=false" >> $GITHUB_OUTPUT
          else
            echo "new=true" >> $GITHUB_OUTPUT
          fi

      - name: Tag + Release erstellen
        if: steps.check.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true

      - uses: actions/setup-node@v4
        if: steps.check.outputs.new == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: npm aktualisieren # OIDC braucht npm >= 11.5.1
        if: steps.check.outputs.new == 'true'
        run: npm install -g npm@latest

      - name: npm publish
        if: steps.check.outputs.new == 'true'
        run: npm publish --access public
